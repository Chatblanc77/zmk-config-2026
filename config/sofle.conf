# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
# Uncomment this line below to add rgb underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.

CONFIG_NICE_OLED_WIDGET_RESPONSIVE=y
CONFIG_ZMK_STUDIO=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# 1. Ép Bongo Cat phản hồi trực tiếp theo từng nhịp bấm phím thay vì chờ tính WPM
CONFIG_NICE_OLED_WIDGET_RESPONSIVE=y

# 2. Giảm thời gian phản hồi animation xuống mức nhạy nhất (mặc định là 300ms)
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT_ANIMATION_MS=100

# 3. Tắt bớt các widget phụ không cần thiết để giảm tải việc vẽ lại màn hình I2C
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n

# 4. Giảm độ trễ giao tiếp hàng đợi sự kiện phím và BLE giữa 2 nửa
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
